<body>
<a class="skip-link" href="#grid">Skip to the list</a>

<div class="bg" aria-hidden="true"></div>

<div class="shell">

  <header class="head">
    <h1 class="wordmark"><span>Zibaldone</span></h1>
    <p class="tagline">Not a blog, it's a zibaldone&hellip; because even chaos deserves a Swiss address. <span class="tagline__ch">(.ch = Switzerland) 🇨🇭</span></p>

    <form class="search" role="search" onsubmit="return false">
      <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="6.6" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <path d="M15.9 15.9L20.5 20.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <input id="q" class="search__input" type="search" autocomplete="off"
             placeholder="Search" aria-label="Search sites" spellcheck="false">
      <button id="qClear" class="search__clear" type="button" aria-label="Clear search" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 7l10 10M17 7L7 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
    </form>

    <div class="toolbar">
      <div class="chips" id="chips" role="tablist" aria-label="Collections"></div>
      <button id="favBtn" class="icon-btn" type="button" aria-pressed="false"
              aria-label="Show only saved" title="Saved">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 4.4l2.4 4.87 5.37.78-3.89 3.79.92 5.36L12 16.66l-4.8 2.54.92-5.36-3.89-3.79 5.37-.78z"
                fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </header>

  <main>
    <p class="count" id="count" role="status" aria-live="polite"></p>

    <section id="grid" class="grid" aria-label="Sites"></section>

    <div id="empty" class="empty" hidden>
      <p>No matches. <button type="button" class="linklike" id="resetBtn">Reset</button></p>
    </div>
  </main>

  <footer class="foot">
    <p class="foot__credit">Powered by <span class="foot__name">Jc.Ye</span></p>
    <nav class="foot__links" aria-label="Elsewhere">
      <a href="https://github.com/skymemoryGit" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a href="https://www.linkedin.com/in/jiancheng-ye-790966201" target="_blank" rel="noopener noreferrer">LinkedIn</a>
    </nav>
  </footer>

</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
